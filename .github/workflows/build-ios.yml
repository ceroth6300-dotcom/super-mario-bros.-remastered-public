
name: Build Mario SideStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_macos.universal.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          GODOT="/tmp/Godot.app/Contents/MacOS/Godot"
          test -f "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.6.1.stable"
          mkdir -p "$DEST"
          cp -R /tmp/templates/templates/. "$DEST/"

          test -f "$DEST/ios.zip"

      - name: Prepare iOS build
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import struct
          import zlib

          project = Path("project.godot")
          data = project.read_text()

          controls = Path("Scripts/iOS/MobileControls.gd")
          entry = 'MobileControls="*res://Scripts/iOS/MobileControls.gd"'

          if controls.is_file() and entry not in data:
              data = data.replace(
                  "[autoload]",
                  "[autoload]\n" + entry,
                  1
              )

          data = re.sub(
              r'(?m)^enabled=PackedStringArray\([^)]*\)',
              'enabled=PackedStringArray()',
              data
          )

          project.write_text(data)

          # Disable native editor extensions for CI.
          # These files are restored when the runner ends.
          disabled = []
          for ext in Path("addons").rglob("*.gdextension"):
              renamed = ext.with_suffix(".gdextension.disabled")
              ext.rename(renamed)
              disabled.append(str(ext))

          Path("build/disabled-extensions.txt").write_text(
              "\n".join(disabled)
          )

          # Generate a temporary opaque 1024x1024 icon.
          width = height = 1024
          row = b"\x00" + bytes([40, 110, 210]) * width
          raw = row * height

          def chunk(name, payload):
              return (
                  struct.pack(">I", len(payload))
                  + name + payload
                  + struct.pack(
                      ">I",
                      zlib.crc32(name + payload) & 0xffffffff
                  )
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      width, height, 8, 2, 0, 0, 0
                  )
              )
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          Path("build/ios-icon.png").write_bytes(png)

          cfg = Path("export_presets.cfg")
          old = cfg.read_text() if cfg.exists() else ""

          ids = [
              int(n) for n in re.findall(
                  r'(?m)^\[preset\.(\d+)\]$',
                  old
              )
          ]
          index = max(ids, default=-1) + 1

          team = os.environ.get("APPLE_TEAM_ID", "").strip()
          if not team:
              team = "ABCDE12345"
              print(
                  "WARNING: Using placeholder Team ID "
                  "for Xcode-project-only export."
              )

          preset = f"""
          [preset.{index}]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json,*.txt,*.bgm,*.mp3,*.fnt"
          exclude_filter=""
          export_path="build/MarioIOS.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.{index}.options]

          custom_template/debug=""
          custom_template/release=""
          application/app_store_team_id="{team}"
          application/bundle_identifier="com.ceroth6300.marioremastered"
          application/short_version="1.0"
          application/version="1"
          application/export_project_only=true
          icons/app_store_1024x1024="res://build/ios-icon.png"
          """

          cfg.write_text(
              old.rstrip() + "\n\n" +
              "\n".join(
                  line.strip()
                  for line in preset.strip().splitlines()
              ) + "\n"
          )

          print("iOS preset configured")
          PY

      - name: Import resources
        shell: bash
        run: |
          set +e

          "$GODOT" --headless --path . \
            --editor --import --quit \
            > build/import.log 2>&1

          STATUS=$?
          set -e

          tail -80 build/import.log

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Godot import exited with $STATUS"
            if [ ! -d ".godot/imported" ]; then
              exit 1
            fi
          fi

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set +e

          "$GODOT" --headless --path . \
            --export-release "iOS" \
            build/MarioIOS.zip \
            > build/export.log 2>&1

          STATUS=$?
          set -e

          echo "Godot export exit: $STATUS"
          tail -150 build/export.log

          if [ ! -s build/MarioIOS.zip ]; then
            echo "::error::iOS export failed."
            exit 1
          fi

          unzip -t build/MarioIOS.zip

          mkdir -p build/xcode
          unzip -q build/MarioIOS.zip -d build/xcode

      - name: Compile unsigned app
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find build/xcode \
            -type d -name "*.xcodeproj" \
            -print -quit)

          test -n "$PROJECT"

          xcodebuild -list -json \
            -project "$PROJECT" \
            > build/xcode-targets.json

          SCHEME=$(python3 - <<'PY'
          import json

          with open("build/xcode-targets.json") as f:
              data = json.load(f)

          project = data.get("project", {})
          schemes = project.get("schemes", [])

          if not schemes:
              raise SystemExit("No Xcode schemes available")

          print(schemes[0])
          PY
          )

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > build/xcode-build.log 2>&1

          STATUS=$?
          set -e

          tail -120 build/xcode-build.log
          exit "$STATUS"

      - name: Package SideStore IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/DerivedData/Build/Products \
            -type d -name "*.app" \
            -print -quit)

          test -n "$APP"

          mkdir -p build/package/Payload
          cp -R "$APP" build/package/Payload/

          cd build/package

          zip -qry \
            ../Mario-Remastered-iOS-unsigned.ipa \
            Payload

          cd ../..

          test -s \
            build/Mario-Remastered-iOS-unsigned.ipa

          echo "IPA packaging complete"

      - name: Upload IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-SideStore-Build
          path: |
            build/*.ipa
            build/import.log
            build/export.log
            build/xcode-build.log
            build/xcode-targets.json
            build/disabled-extensions.txt
          if-no-files-found: warn
