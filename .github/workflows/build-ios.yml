
name: Build Mario iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_macos.universal.zip" \
            -o /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT=$(find /tmp/godot -type f \
            -path "*/MacOS/Godot" | head -1)

          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install iOS templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.6.1.stable"

          mkdir -p "$DEST" /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$DEST/"

          test -f "$DEST/ios.zip"

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path("project.godot")
          data = path.read_text()

          entry = 'MobileControls="*res://Scripts/iOS/MobileControls.gd"'
          controls = Path("Scripts/iOS/MobileControls.gd")

          if controls.is_file() and entry not in data:
              if "[autoload]" not in data:
                  raise SystemExit("Missing autoload section")
              data = data.replace(
                  "[autoload]",
                  "[autoload]\n" + entry,
                  1
              )

          data = re.sub(
              r'(?m)^enabled=PackedStringArray\([^)]*\)',
              'enabled=PackedStringArray()',
              data
          )

          path.write_text(data)

          cfg = Path("export_presets.cfg")
          old = cfg.read_text() if cfg.exists() else ""

          ids = [
              int(x) for x in re.findall(
                  r'(?m)^\[preset\.(\d+)\]$',
                  old
              )
          ]
          idx = max(ids, default=-1) + 1

          preset = f"""
          [preset.{idx}]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json,*.txt,*.bgm,*.mp3,*.fnt"
          exclude_filter=""
          export_path="build/MarioIOS.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.{idx}.options]

          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.ceroth6300.marioremastered"
          application/short_version="1.0"
          application/version="1"
          application/export_project_only=true
          """

          cfg.write_text(
              old.rstrip() + "\n\n" +
              textwrap.dedent(preset).strip() + "\n"
          )

          print("iOS configuration prepared")
          PY

      - name: Import game assets
        shell: bash
        run: |
          set +e

          "$GODOT" --headless --path . \
            --editor --import --quit \
            > build/import.log 2>&1

          STATUS=$?
          set -e

          echo "Import exit code: $STATUS"
          tail -100 build/import.log

          if [ "$STATUS" -ne 0 ]; then
            if [ -d ".godot/imported" ] && \
               grep -q "Finalizing Asset Import" build/import.log; then
              echo "::warning::Godot crashed after reaching import finalization. Trying export."
            else
              echo "::error::Import failed before finalization."
              exit 1
            fi
          fi

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set +e

          "$GODOT" --headless --path . \
            --export-release "iOS" \
            build/MarioIOS.zip \
            > build/export.log 2>&1

          STATUS=$?
          set -e

          tail -120 build/export.log

          if [ ! -s build/MarioIOS.zip ]; then
            echo "::error::iOS export not created."
            exit 1
          fi

          unzip -t build/MarioIOS.zip

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Godot exited with code $STATUS after creating the ZIP."
          fi

      - name: Upload build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-iOS-Build
          path: build/
          if-no-files-found: warn
