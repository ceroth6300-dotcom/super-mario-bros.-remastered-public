
name: Diagnose Mario iOS Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build /tmp/godot

          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_macos.universal.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT=$(find /tmp/godot -type f \
            -path "*/MacOS/Godot" -print -quit)

          test -n "$GODOT"
          chmod +x "$GODOT"

          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          "$GODOT" --headless --version

      - name: Install iOS templates
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/templates

          unzip -q /tmp/templates.tpz \
            -d /tmp/templates

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.6.1.stable"

          mkdir -p "$DEST"

          cp -R /tmp/templates/templates/. "$DEST/"

          test -f "$DEST/ios.zip"

          echo "iOS templates installed."

      - name: Prepare export configuration
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build/output

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import struct
          import zlib

          p = Path("project.godot")
          data = p.read_text()

          control = Path(
              "Scripts/iOS/MobileControls.gd"
          )

          entry = (
              'MobileControls='
              '"*res://Scripts/iOS/MobileControls.gd"'
          )

          if control.is_file() and entry not in data:
              if "[autoload]" not in data:
                  raise SystemExit(
                      "Missing [autoload] section"
                  )
              data = data.replace(
                  "[autoload]",
                  "[autoload]\n" + entry,
                  1
              )

          # Disable editor plugins in CI.
          data = re.sub(
              r'(?m)^enabled=PackedStringArray\([^)]*\)',
              'enabled=PackedStringArray()',
              data
          )
          p.write_text(data)

          # Generate temporary 1024px PNG icon.
          size = 1024
          raw = (
              b"\x00"
              + bytes([45, 112, 210]) * size
          ) * size

          def chunk(tag, payload):
              return (
                  struct.pack(">I", len(payload))
                  + tag + payload
                  + struct.pack(
                      ">I",
                      zlib.crc32(tag + payload)
                      & 0xffffffff
                  )
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      size, size, 8, 2, 0, 0, 0
                  )
              )
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          Path("ios-icon.png").write_bytes(png)

          # Preserve existing export presets.
          cfg = Path("export_presets.cfg")
          old = cfg.read_text() if cfg.exists() else ""

          existing = re.findall(
              r'(?m)^\[preset\.(\d+)\]$',
              old
          )

          idx = max(
              (int(n) for n in existing),
              default=-1
          ) + 1

          team = os.getenv(
              "APPLE_TEAM_ID", ""
          ).strip()

          if not team:
              team = "ABCDE12345"
              print(
                  "WARNING: Placeholder Apple Team ID."
              )

          if not re.fullmatch(
              r"[A-Z0-9]{10}", team
          ):
              raise SystemExit(
                  "Invalid Apple Team ID format"
              )

          preset = f"""
          [preset.{idx}]

          name="iOS Diagnostic"
          platform="iOS"
          runnable=true
          advanced_options=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/output/MarioIOS.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.{idx}.options]

          custom_template/debug=""
          custom_template/release=""
          application/app_store_team_id="{team}"
          application/bundle_identifier="com.ceroth6300.marioremastered"
          application/short_version="1.0"
          application/version="1"
          application/export_project_only=true
          icons/app_store_1024x1024="res://ios-icon.png"
          """

          cfg.write_text(
              old.rstrip() + "\n\n" +
              "\n".join(
                  line.strip()
                  for line in preset.strip().splitlines()
              ) + "\n"
          )

          safe = cfg.read_text().replace(
              team, "REDACTED_TEAM_ID"
          )

          Path(
              "build/export-preset-diagnostic.txt"
          ).write_text(safe)

          print("Diagnostic iOS preset prepared.")
          PY

      - name: Import resources
        shell: bash
        run: |
          set +e

          "$GODOT" --headless \
            --verbose \
            --path . \
            --editor --import --quit \
            > build/import.log 2>&1

          STATUS=$?

          echo "$STATUS" > build/import-exit-code.txt
          echo "Import exit code: $STATUS"

          tail -100 build/import.log

          exit 0

      - name: Diagnose iOS export
        shell: bash
        run: |
          set +e

          "$GODOT" --headless \
            --verbose \
            --path . \
            --export-release "iOS Diagnostic" \
            build/output/MarioIOS.zip \
            > build/export.log 2>&1

          STATUS=$?

          echo "$STATUS" > build/export-exit-code.txt
          echo "Export exit code: $STATUS"

          tail -200 build/export.log

          if [ -s build/output/MarioIOS.zip ]; then
            echo "Xcode export created!"
            unzip -t build/output/MarioIOS.zip
          else
            echo "::error::Godot iOS export failed."
            exit 1
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-iOS-Diagnostics
          path: |
            build/import.log
            build/export.log
            build/import-exit-code.txt
            build/export-exit-code.txt
            build/export-preset-diagnostic.txt
            build/output/MarioIOS.zip
          if-no-files-found: warn
