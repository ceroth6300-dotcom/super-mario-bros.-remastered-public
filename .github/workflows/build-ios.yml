
name: Build Mario SideStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout Mario project
        uses: actions/checkout@v4

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_macos.universal.zip" \
            -o /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT=$(find /tmp/godot -type f \
            -path "*/MacOS/Godot" -print -quit)

          test -n "$GODOT"
          chmod +x "$GODOT"

          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          "$GODOT" --headless --version

      - name: Install iOS export templates
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.6.1.stable"

          mkdir -p "$DEST"
          mkdir -p /tmp/godot-templates

          unzip -q /tmp/templates.tpz \
            -d /tmp/godot-templates

          cp -R /tmp/godot-templates/templates/. "$DEST/"

          test -f "$DEST/ios.zip"

          echo "iOS templates installed."

      - name: Configure iOS project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("project.godot")
          data = project.read_text()

          controls = Path(
              "Scripts/iOS/MobileControls.gd"
          )

          entry = (
              'MobileControls='
              '"*res://Scripts/iOS/MobileControls.gd"'
          )

          if controls.is_file() and entry not in data:
              if "[autoload]" not in data:
                  raise SystemExit(
                      "Autoload section not found"
                  )

              data = data.replace(
                  "[autoload]",
                  "[autoload]\n" + entry,
                  1
              )

          # Disable editor-only plugins for CI.
          data = re.sub(
              r'(?m)^enabled=PackedStringArray\([^)]*\)',
              'enabled=PackedStringArray()',
              data
          )

          project.write_text(data)

          cfg = Path("export_presets.cfg")
          old = (
              cfg.read_text()
              if cfg.exists() else ""
          )

          ids = [
              int(n)
              for n in re.findall(
                  r'(?m)^\[preset\.(\d+)\]$',
                  old
              )
          ]

          index = max(ids, default=-1) + 1

          preset = f"""
          [preset.{index}]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json,*.txt,*.bgm,*.mp3,*.fnt"
          exclude_filter=""
          export_path="build/MarioIOS.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.{index}.options]

          custom_template/debug=""
          custom_template/release=""
          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.ceroth6300.marioremastered"
          application/short_version="1.0"
          application/version="1"
          application/export_project_only=true
          application/icon_interpolation=4
          icons/icon_1024x1024="res://build/ios-icon.png"
          """

          cfg.write_text(
              old.rstrip()
              + "\n\n"
              + "\n".join(
                  line.strip()
                  for line in preset.strip().splitlines()
              )
              + "\n"
          )

          print("Mario iOS export preset created.")
          PY

          test -f icon.png

          sips -s format png \
            -z 1024 1024 icon.png \
            --out build/ios-icon.png

      - name: Import game resources
        shell: bash
        run: |
          set +e

          "$GODOT" --headless \
            --path . \
            --editor --import --quit \
            > build/import.log 2>&1

          STATUS=$?
          set -e

          echo "Import exit code: $STATUS"
          tail -100 build/import.log

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Import exited abnormally."

            if [ ! -d ".godot/imported" ]; then
              echo "::error::No imported assets."
              exit 1
            fi

            echo "Trying export for diagnostics."
          fi

      - name: Export Xcode project
        shell: bash
        run: |
          set +e

          "$GODOT" --headless \
            --path . \
            --export-release "iOS" \
            build/MarioIOS.zip \
            > build/export.log 2>&1

          STATUS=$?
          set -e

          echo "Export exit code: $STATUS"
          tail -150 build/export.log

          if [ ! -s build/MarioIOS.zip ]; then
            echo "::error::Godot did not export an Xcode project."
            exit 1
          fi

          unzip -t build/MarioIOS.zip

          mkdir -p build/xcode
          unzip -q build/MarioIOS.zip \
            -d build/xcode

          find build/xcode -name "*.xcodeproj"

      - name: Compile unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find build/xcode \
            -name "*.xcodeproj" \
            -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::Xcode project not found."
            exit 1
          fi

          echo "Building $PROJECT"

          xcodebuild -list -json \
            -project "$PROJECT" \
            > build/xcode-targets.json

          TARGET=$(python3 - <<'PY'
          import json

          with open("build/xcode-targets.json") as f:
              data = json.load(f)

          project = data.get("project", {})
          targets = project.get("targets", [])

          if not targets:
              raise SystemExit("No Xcode targets found")

          print(targets[0])
          PY
          )

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > build/xcode-build.log 2>&1

          STATUS=$?
          set -e

          tail -120 build/xcode-build.log

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Package unsigned SideStore IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/DerivedData/Build/Products \
            -type d -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::Compiled iOS app not found."
            exit 1
          fi

          mkdir -p build/package/Payload

          cp -R "$APP" \
            build/package/Payload/

          cd build/package

          zip -qry \
            ../Mario-Remastered-iOS-unsigned.ipa \
            Payload

          cd ../..

          test -s \
            build/Mario-Remastered-iOS-unsigned.ipa

          echo "Unsigned Mario IPA created!"

      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-SideStore-iOS
          path: |
            build/*.ipa
            build/import.log
            build/export.log
            build/xcode-build.log
            build/xcode-targets.json
          if-no-files-found: warn

