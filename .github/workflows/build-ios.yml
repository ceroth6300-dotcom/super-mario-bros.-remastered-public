
name: Build Mario iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_macos.universal.zip" \
            -o /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT=$(find /tmp/godot -type f \
            -path "*/MacOS/Godot" | head -1)

          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install iOS templates
        shell: bash
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/4.6.1-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v4.6.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.6.1.stable"

          mkdir -p "$DEST" /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$DEST/"

          test -f "$DEST/ios.zip"

      - name: Configure game for iOS
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p build

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import struct
          import zlib

          project = Path("project.godot")
          data = project.read_text()

          controls = Path("Scripts/iOS/MobileControls.gd")
          entry = 'MobileControls="*res://Scripts/iOS/MobileControls.gd"'

          if controls.exists() and entry not in data:
              if "[autoload]" not in data:
                  raise SystemExit("Missing autoload section")
              data = data.replace(
                  "[autoload]",
                  "[autoload]\n" + entry,
                  1
              )

          data = re.sub(
              r'(?m)^enabled=PackedStringArray\([^)]*\)',
              'enabled=PackedStringArray()',
              data
          )

          project.write_text(data)

          # Generate a temporary 1024px iOS icon.
          width = 1024
          height = 1024
          row = bytes([33, 91, 172]) * width
          raw = b"".join(
              b"\x00" + row for _ in range(height)
          )

          def chunk(tag, payload):
              return (
                  struct.pack(">I", len(payload))
                  + tag + payload
                  + struct.pack(
                      ">I",
                      zlib.crc32(tag + payload)
                      & 0xffffffff
                  )
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      width, height, 8, 2, 0, 0, 0
                  )
              )
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          Path("build/ios-icon.png").write_bytes(png)

          config = Path("export_presets.cfg")
          old = (
              config.read_text()
              if config.exists() else ""
          )

          # Remove previous iOS presets in CI only.
          parts = re.split(
              r'(?=^\[preset\.\d+\]$)',
              old,
              flags=re.MULTILINE
          )

          kept = [parts[0]]
          for part in parts[1:]:
              if not re.search(
                  r'(?m)^platform="iOS"$', part
              ):
                  kept.append(part)

          old = "".join(kept)

          ids = [
              int(i) for i in re.findall(
                  r'(?m)^\[preset\.(\d+)\]$',
                  old
              )
          ]

          idx = max(ids, default=-1) + 1

          team = os.environ.get(
              "APPLE_TEAM_ID", ""
          ).strip() or "ABCDE12345"

          if not re.fullmatch(
              r'[A-Z0-9]{10}', team
          ):
              raise SystemExit(
                  "APPLE_TEAM_ID must be 10 characters"
              )

          preset = f"""
          [preset.{idx}]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json,*.txt,*.bgm,*.mp3,*.fnt"
          exclude_filter=""
          export_path="build/MarioIOS.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.{idx}.options]

          custom_template/debug=""
          custom_template/release=""
          application/app_store_team_id="{team}"
          application/bundle_identifier="com.ceroth6300.marioremastered"
          application/short_version="1.0"
          application/version="1"
          application/export_project_only=true
          icons/icon_1024x1024="res://build/ios-icon.png"
          """

          config.write_text(
              old.rstrip()
              + "\n\n"
              + "\n".join(
                  line.strip()
                  for line in preset.strip().splitlines()
              )
              + "\n"
          )

          print("iOS preset created.")
          PY

      - name: Import assets
        shell: bash
        run: |
          set +e

          "$GODOT" --headless --path . \
            --editor --import --quit \
            > build/import.log 2>&1

          STATUS=$?
          set -e

          echo "Import status: $STATUS"
          tail -80 build/import.log

          if [ "$STATUS" -ne 0 ]; then
            if [ -d ".godot/imported" ]; then
              echo "::warning::Import crashed; attempting export for diagnostics."
            else
              echo "::error::No imported assets."
              exit 1
            fi
          fi

      - name: Export Xcode project
        shell: bash
        run: |
          set +e

          "$GODOT" --headless --path . \
            --export-release "iOS" \
            build/MarioIOS.zip \
            > build/export.log 2>&1

          STATUS=$?
          set -e

          echo "Export status: $STATUS"
          cat build/export.log

          if [ ! -s build/MarioIOS.zip ]; then
            echo "::error::iOS export missing."
            exit 1
          fi

          unzip -t build/MarioIOS.zip

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Godot exited abnormally after creating export."
          fi

      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-iOS-Build
          path: build/
          if-no-files-found: warn
